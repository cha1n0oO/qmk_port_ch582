name: Build keyboard firmware
run-name: Build keyboard firmware

on:
  push:
    branches: ["via"]
  workflow_dispatch:
    inputs:
      keyboard:
        description: "Keyboard name"
        required: true
        type: string
      keymap:
        description: "Specified keymap"
        default: "default"
        required: true
        type: string

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 签出代码并递归拉取所有子模块
      - uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 获取所有分支/标签（为 git describe 做准备）
      - name: Fetch all
        run: git fetch --tags

      # 3. 准备子模块（如果 checkout 未完全拉取，额外执行一次）
      - name: Prepare Submodules
        run: git submodule update --init --recursive --force

      # 4. 安装 Python 依赖
      - name: Prepare Python requirements
        run: pip3 install -r ./mcuboot/scripts/requirements.txt

      # 5. 配置 CMake
      - name: Configure CMake
        run: |
          cmake --no-warn-unused-cli \
            -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE \
            -DCMAKE_BUILD_TYPE:STRING=${{ env.BUILD_TYPE }} \
            -Dkeyboard:STRING="${{ github.event_name == 'push' && 'HHKB' || inputs.keyboard }}" \
            -Dkeymap:STRING="${{ github.event_name == 'push' && 'default' || inputs.keymap }}" \
            -DBUILD_WIRELESS_LIB:BOOL=OFF \
            -S${{ github.workspace }} \
            -B${{ github.workspace }}/build

      # 6. 编译
      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --target all --

      # 7. 获取版本号（优先 git describe，失败则用短 hash）
      - name: Get git version
        run: |
          if ! git describe --always --dirty > /dev/null 2>&1; then
            echo "git_ver=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          else
            echo "git_ver=$(git describe --always --dirty)" >> $GITHUB_ENV
          fi

      # 8. 调试：列出构建产物（便于确认实际文件名）
      - name: List build artifacts
        run: ls -la ${{ github.workspace }}/build/

      # 9. 上传 UF2 固件
      - name: UF2 Firmware (${{ inputs.keyboard }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.keyboard }}.uf2
          path: ${{ github.workspace }}/build/${{ inputs.keyboard }}_upgrade_${{ env.git_ver }}.uf2

      # 10. 上传 Hex 固件
      - name: Hex Firmware (${{ inputs.keyboard }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.keyboard }}.hex
          path: ${{ github.workspace }}/build/${{ inputs.keyboard }}_factory_${{ env.git_ver }}.hex