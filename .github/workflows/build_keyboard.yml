name: Build keyboard firmware
run-name: Build keyboard firmware

on:
  push:
    branches: ["via"]
  workflow_dispatch:
    inputs:
      keyboard:
        description: "Keyboard name"
        required: true
        type: string
      keymap:
        description: "Specified keymap"
        default: "default"
        required: true
        type: string

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch all
        run: git fetch

      - name: Prepare Submodules
        run: git -c submodule."qmk_porting/keyboards_private".update=none submodule update --recursive --init

      - name: Prepare Python requirements
        run: pip3 install -r ./mcuboot/scripts/requirements.txt
      
      - name: Check HHKB directory
        run: ls -la qmk_porting/keyboards/HHKB/

      - name: Configure CMake
        # 使用条件表达式：
        # 当事件为 push 时，使用固定默认值 "your_default_keyboard" 和 "default"
        # 当事件为 workflow_dispatch 时，使用用户输入的值
        run: |
          cmake --no-warn-unused-cli \
            -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE \
            -DCMAKE_BUILD_TYPE:STRING=${{ env.BUILD_TYPE }} \
            -Dkeyboard:STRING="${{ github.event_name == 'push' && 'imk64' || inputs.keyboard }}" \
            -Dkeymap:STRING="${{ github.event_name == 'push' && 'default' || inputs.keymap }}" \
            -S${{ github.workspace }} \
            -B${{ github.workspace }}/build

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --target all --

      - name: Get git version
        run: echo "git_ver=$(git describe --always --dirty)" >> $GITHUB_ENV

      # （可选）调试：列出构建产物，帮助确认实际文件名
      - name: List build artifacts
        run: ls -la ${{ github.workspace }}/build/

      - name: UF2 Firmware (${{ inputs.keyboard }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.keyboard }}.uf2
          # 注意：假设固件文件在 build/ 目录下
          path: ${{ github.workspace }}/build/${{ inputs.keyboard }}_upgrade_${{ env.git_ver }}.uf2

      - name: Hex Firmware (${{ inputs.keyboard }})
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.keyboard }}.hex
          path: ${{ github.workspace }}/build/${{ inputs.keyboard }}_factory_${{ env.git_ver }}.hex