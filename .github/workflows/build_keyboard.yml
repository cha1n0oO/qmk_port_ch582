name: Build keyboard firmware
run-name: Build keyboard firmware

on:
  push:
    branches: ["via"]
  workflow_dispatch:
    inputs:
      keyboard:
        description: "Keyboard name"
        required: true
        type: string
      keymap:
        description: "Specified keymap"
        default: "default"
        required: true
        type: string

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch all tags
        run: git fetch --tags

      - name: Prepare Submodules (skip private)
        run: |
          git submodule sync --recursive
          git -c submodule."qmk_porting/keyboards_private".update=none submodule update --init --recursive --force

      - name: Prepare Python requirements
        run: pip3 install -r ./mcuboot/scripts/requirements.txt

      - name: Create dummy wireless directory for CMake
        run: |
          mkdir -p ${{ github.workspace }}/qmk_porting/keyboards/HHKB/wireless/include
          touch ${{ github.workspace }}/qmk_porting/keyboards/HHKB/wireless/libHHKB.a
          ls -la ${{ github.workspace }}/qmk_porting/keyboards/HHKB/wireless/

      - name: Configure CMake
        run: |
          cmake --no-warn-unused-cli \
            -DCMAKE_EXPORT_COMPILE_COMMANDS:BOOL=TRUE \
            -DCMAKE_BUILD_TYPE:STRING=${{ env.BUILD_TYPE }} \
            -Dkeyboard:STRING="${{ github.event_name == 'push' && 'HHKB' || inputs.keyboard }}" \
            -Dkeymap:STRING="${{ github.event_name == 'push' && 'default' || inputs.keymap }}" \
            -DBUILD_WIRELESS_LIB:BOOL=OFF \
            -S${{ github.workspace }} \
            -B${{ github.workspace }}/build

      - name: Build
        run: cmake --build ${{ github.workspace }}/build --config ${{ env.BUILD_TYPE }} --target all --

      - name: Get git version
        run: |
          if ! git describe --always --dirty > /dev/null 2>&1; then
            echo "git_ver=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          else
            echo "git_ver=$(git describe --always --dirty)" >> $GITHUB_ENV
          fi

      # 关键：将 Hex 文件复制到根目录，便于上传
      - name: Copy hex to workspace root
        run: |
          KEYBOARD_NAME="${{ github.event_name == 'push' && 'HHKB' || inputs.keyboard }}"
          if [ -f "${{ github.workspace }}/build/${KEYBOARD_NAME}.hex" ]; then
            cp "${{ github.workspace }}/build/${KEYBOARD_NAME}.hex" "${{ github.workspace }}/"
            echo "✅ Copied ${KEYBOARD_NAME}.hex to root"
          else
            echo "⚠️ Hex file not found in build/, listing contents:"
            ls -la ${{ github.workspace }}/build/
            exit 1
          fi

      - name: List build artifacts
        run: |
          KEYBOARD_NAME="${{ github.event_name == 'push' && 'HHKB' || inputs.keyboard }}"
          echo "Effective keyboard name: $KEYBOARD_NAME"
          echo "=== Files in build/ ==="
          ls -la ${{ github.workspace }}/build/
          echo "=== UF2 in root ==="
          ls -la ${{ github.workspace }}/${KEYBOARD_NAME}_upgrade_*.uf2 2>/dev/null || echo "No UF2 found"
          echo "=== Hex in root ==="
          ls -la ${{ github.workspace }}/${KEYBOARD_NAME}.hex 2>/dev/null || echo "No Hex in root"

      - name: UF2 Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && 'HHKB' || inputs.keyboard }}.uf2
          path: ${{ github.workspace }}/${{ github.event_name == 'push' && 'HHKB' || inputs.keyboard }}_upgrade_${{ env.git_ver }}.uf2

      - name: Hex Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && 'HHKB' || inputs.keyboard }}.hex
          path: ${{ github.workspace }}/${{ github.event_name == 'push' && 'HHKB' || inputs.keyboard }}.hex